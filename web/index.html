  <style>
    body {
      background-color: #1A1A1A; /* Matches your dark theme */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-text {
      margin-top: 24px;
      color: #FFDD55; /* Matches your yellow accent */
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      animation: fade 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fade {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="splash-container" id="splash">
  <img class="splash-logo" src="icons/Icon-192.png" alt="Ahsan Dev Logo" />
  <div class="splash-text">AHSAN DEV</div>
</div>

<script>
  window.addEventListener('load', function(ev) {
    // Download main.dart.js
    _flutter.loader.load({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          // Remove the splash screen right before running the app
          if (document.getElementById('splash')) {
            document.getElementById('splash').remove();
          }
          appRunner.runApp();
        });
      }
    });
  });
</script>
<script src="flutter_bootstrap.js" async></script>
